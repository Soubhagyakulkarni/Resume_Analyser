[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-analyzer"
version = "0.1.0"
description = "Privacy-conscious AI resume analysis and job recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.55,<3",
    "google-genai>=1.11,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "reportlab>=4.2,<6",
    "streamlit>=1.40,<2",
    "plotly>=5,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools]
py-modules = []
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "config*",
    "integrations*",
    "models*",
    "parsers*",
    "prompts*",
    "reports*",
    "repositories*",
    "services*",
    "utils*",
]

[tool.setuptools.package-data]
prompts = ["*.txt"]
repositories = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
